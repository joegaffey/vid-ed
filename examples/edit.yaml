# Example vided edit script (EDL, `vided.edl/3`).
# The timeline is two tracks of clip references; clips are defined ONLY in
# clips.yaml (see ./clips.yaml). Validate/resolve with:
#   vided compose edit.yaml --check --lint
# Render with:
#   vided render edit.yaml --dry-run

schema: vided.edl/3

output:
  format: 1080p30            # a name from the canonical set (see AGENTS.md)
  path: out/final.mp4
  loudness_lufs: -14
  crf: 23
  preset: medium

tracks:
  visual:
    - { id: intro, use: title-intro }
    - { id: chapter1, use: chapter1 }
    - { id: broll, use: sel-open, transition_in: { type: fade, duration: 0.5 } }
    - { id: detail, use: sel-detail, speed: 0.5 }
    - { id: fw, use: slide-fw }
    - { id: gist, use: still-gist }
  audio:
    # Free-positioned on the audio track; offset + gain per placement.
    - { id: vo, use: vo, offset: 0 }

captions:
  mode: soft            # soft (default) | burn (opt-in) | none
  file: work/captions.srt
  export: [srt, vtt]

overlays:
  - type: image
    source: <image-asset-id>
    start: 0
    end: 4
    position: top-right
    opacity: 0.9
    width: 160
  - type: text
    text: "Chapter 1"
    start: 1
    end: 3.5
    position: bottom
    style: { size: 64, color: "#ffffff" }

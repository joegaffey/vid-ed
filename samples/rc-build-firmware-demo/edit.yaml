timeline:
  - id: intro
    title: "RC Controller Build"
    subtitle: "Adapter, firmware, and track test"
    duration: 3
    background: "#101820"
    transition_out: { type: fade, duration: 0.5 }
  - id: chapter1
    title: "Chapter 1"
    subtitle: "Building the receiver adapter"
    duration: 2.5
    background: "#1b2a41"
  - id: design_a
    source: 6968766a76c9
    in: 42
    out: 50
  - id: design_b
    source: 6968766a76c9
    in: 216
    out: 226
  - id: design_c
    source: 6968766a76c9
    in: 446
    out: 460
  - id: chapter2
    title: "Chapter 2"
    subtitle: "The firmware"
    duration: 2.5
    background: "#132a1b"
  - id: fw1
    slide: "rc_controller.ino"
    kind: mono
    duration: 7
    body: |
      #include <Joystick.h>

      #define ThrottlePin 2
      #define SteeringPin 3

      Joystick_ Joystick;
  - id: fw2
    slide: "setup()"
    kind: mono
    duration: 7
    body: |
      pinMode(ThrottlePin, INPUT);
      pinMode(SteeringPin, INPUT);

      Joystick.begin();
      Joystick.setXAxisRange(1900, 1050);
      Joystick.setYAxisRange(1050, 1900);
  - id: fw3
    slide: "loop()"
    kind: mono
    duration: 7
    body: |
      ThrottleValue = pulseIn(ThrottlePin, HIGH);
      SteeringValue = pulseIn(SteeringPin, HIGH);

      Joystick.setXAxis(SteeringValue);
      Joystick.setYAxis(ThrottleValue);
  - id: chapter3
    title: "Chapter 3"
    subtitle: "The controller in action"
    duration: 2.5
    background: "#2a1b41"
  - id: test
    source: f7a2a7f14965
    in: 0
    out: 24
audio:
  voiceover:
    source: work/narration-fw.wav
    start: 0
    gain_db: 0
captions:

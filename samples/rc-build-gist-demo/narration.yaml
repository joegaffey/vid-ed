schema: vided.narration/1
voice: en_US-amy-medium
segments:
  - text: "Welcome to the build!"
    start: 0
    gap_after: 0.2
  - text: "First, the adapter case."
    start: 3
    gap_after: 0.2
  - text: "I designed this case in my own 3D editor, called 3table."
    start: 5.5
    gap_after: 0.2
  - text: "The board slots into place, with vents and connectors lining up."
    start: 13.5
    gap_after: 0.2
  - text: "And the finished case comes together, lid and all."
    start: 23.5
    gap_after: 0.2
  - text: "Every board and standoff has its place."
    start: 30
    gap_after: 0.2
  - text: "Next, the firmware, straight from the gist."
    start: 37.5
    gap_after: 0.2
  - text: "We include the Joystick library and define the throttle and steering pins."
    start: 40
    gap_after: 0.2
  - text: "In setup, we enable the pins and set the X and Y axis ranges."
    start: 48
    gap_after: 0.2
  - text: "And in the loop, pulseIn reads each channel and feeds the joystick axes."
    start: 56
    gap_after: 0.2
  - text: "Now, the tricky part. Let's test it."
    start: 64
    gap_after: 0.2
  - text: "I was recording the video with one hand and steering with the other."
    start: 66.5
    gap_after: 0.2
  - text: "Driving one-handed was not easy, but it works! RACELOGIC timing keeps score as the laps come in."
    start: 74
    gap_after: 0.2
